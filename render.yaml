# Blueprint de Render para el backend (plan gratuito).
# La base de datos NO va aqui: se usa Neon (el Postgres gratis de Render caduca
# a los 30 dias y este necesita la extension pgvector).
#
# Uso: en Render -> New -> Blueprint -> apuntar a este repo.
# Las variables marcadas `sync: false` se rellenan a mano en el panel (secretos).

services:
  - type: web
    name: tesis-backend
    runtime: docker
    plan: free
    # Ohio = us-east-2, la misma region que la base en Neon. Si la base queda
    # en otra region, cada consulta cruza el pais y el analisis hace varias.
    region: ohio
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # --- Entorno ---
      - key: APP_ENV
        value: prod          # sin --reload; las instancias free son de 512 MB

      # --- Base de datos (Neon) ---
      # Pegar la cadena de Neon TERMINADA en ?sslmode=require
      - key: DATABASE_URL
        sync: false

      # --- Sesiones ---
      - key: JWT_SECRET
        generateValue: true  # Render genera un secreto aleatorio
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"

      # --- LLM: OpenAI ---
      # Se probo Gemini por su capa compatible (OPENAI_BASE_URL apuntando a
      # Google) y funciona, pero el tier gratis da 5 peticiones/minuto y un
      # analisis gasta 2: en una sesion real se traba. Con gpt-4.1 una sesion
      # completa cuesta ~0,26 USD y coincide con los resultados de la tesis.
      # OPENAI_BASE_URL se deja SIN declarar a proposito: vacia = API de OpenAI.
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false          # API key de OpenAI (sk-proj-...)
      - key: OPENAI_MODEL
        value: gpt-4.1

      # --- Embeddings: OpenAI, NO Gemini ---
      # El tier gratis de Gemini topa en 1000 embeddings al dia y el corpus son
      # 844: no alcanza para reindexar. text-embedding-3-small cuesta centavos
      # y no tiene tope diario. Por eso lleva su propia credencial.
      - key: EMBEDDING_PROVIDER
        value: openai
      # Misma clave que el LLM ahora que ambos son OpenAI; se deja separada
      # por si vuelven a ser proveedores distintos.
      - key: EMBEDDING_OPENAI_API_KEY
        sync: false          # API key de OpenAI (sk-proj-...)
      - key: EMBEDDING_MODEL_OPENAI
        value: text-embedding-3-small
      - key: EMBEDDING_DIM
        value: "1024"        # debe coincidir con la columna VECTOR(1024)
      - key: EMBEDDING_RPM
        value: "0"           # OpenAI no necesita freno

      # --- RAG ---
      - key: RAG_K_POR_CONSULTA
        value: "4"
      - key: RAG_MAX_FRAGMENTOS
        value: "10"

      # --- CORS: dominio del frontend en Vercel ---
      - key: CORS_ORIGINS
        sync: false          # p. ej. https://tesis-nico.vercel.app
